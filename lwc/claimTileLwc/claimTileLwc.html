<template>
    <div class="tile slds-box slds-p-around_medium slds-theme_default slds-m-bottom_small">
        <header class="slds-media slds-media_center slds-m-bottom_small">
            <div class="slds-media__figure">
                <lightning-icon icon-name={policyIcon} alternative-text={claimData.policyType} size="small"></lightning-icon>
            </div>
            <div class="slds-media__body slds-m-left_small">
                <h2 class="slds-text-heading_medium slds-m-bottom_none">Claim: {claimData.claimNumber}</h2>
                <p class="slds-text-body_small">Policy Type: <strong>{claimData.policyType}</strong></p>
            </div>
        </header>
        <div class="slds-border_top slds-p-top_small">
            <p>Policy Holder: <strong>{claimData.policyHolderName}</strong></p>
            <p>Claim Amount:
                <lightning-formatted-number value={claimData.claimAmount} format-style="currency" currency-code="USD"></lightning-formatted-number>
            </p>
            <p>Status: {claimData.status}</p>
            <p>Days Open: <strong class="slds-text-color_error">{claimData.daysOpen}</strong></p>
        </div>
    </div>
</template>
